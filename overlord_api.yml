  parameters:
    ClientIdPath:
      in: path
      name: clientId
      required: true
      schema:
        type: string
      description: Unique identifier for the client.

  responses:
    WebSocketUpgrade:
      description: Switching Protocols

  schemas:
    CommandRequest:
      oneOf:
        - type: object
          properties:
            action:
              type: string
            waitForResult:
              type: boolean
        - type: object
          properties:
            action:
              type: string

    CommandResponse:
      oneOf:
        - type: object
          properties:
            ok:
              type: boolean
            pingMs:
              nullable: true
              type: object
            sent:
              type: boolean
            updated:
              type: boolean
        - type: object
          properties:
            ok:
              type: boolean
            pingMs:
              type: integer
            sent:
              type: boolean
            updated:
              type: boolean
        - type: object
          properties:
            ok:
              type: boolean

    PluginsResponse:
      type: object
      properties:
        plugins:
          type: array
          # Fixed: An empty schema {} is valid (means any item is allowed), 
          # but you should define the plugin structure if known.
          items: {}

    ThumbnailPostResponse:
      type: object
      properties:
        ok:
          type: boolean
        updated:
          type: boolean
        version:
          type: integer