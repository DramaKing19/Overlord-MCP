  /mfa/enable:
    post:
      operationId: postapimfaenable
      parameters:
        - name: Accept-Language
          in: header
          schema:
            type: string
        - name: Cache-Control
          in: header
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
        - name: DNT
          in: header
          schema:
            type: string
        - name: Origin
          in: header
          schema:
            type: string
        - name: Pragma
          in: header
          schema:
            type: string
        - name: Referer
          in: header
          schema:
            type: string
        - name: Sec-Fetch-Dest
          in: header
          schema:
            type: string
        - name: Sec-Fetch-Mode
          in: header
          schema:
            type: string
        - name: Sec-Fetch-Site
          in: header
          schema:
            type: string
        - name: sec-ch-ua
          in: header
          schema:
            type: string
        - name: sec-ch-ua-mobile
          in: header
          schema:
            type: string
        - name: sec-ch-ua-platform
          in: header
          schema:
            type: string
      responses:
        '400':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Invalid MFA code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
            example:
              code: '123456'
